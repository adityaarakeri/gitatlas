name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 24 exercises the --liftoff-only workaround for nodejs/node#63421
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: smoke test extractor and viewer generation
        run: |
          npm run extract -- fixtures
          test -f fixtures/.gitatlas/group.json
          test -f fixtures/.gitatlas/index.html
          node -e "if (require('fs').readFileSync('fixtures/.gitatlas/index.html','utf8').includes('/*__DATA__*/null')) process.exit(1)"
      - name: smoke test scoper
        run: |
          printf 'at PaymentService.charge (src/services/payment.ts:3:1)\n' > /tmp/t.txt
          npm run scope -- --trace /tmp/t.txt --out fixtures/.gitatlas --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d);if(!r.anchor.resolved)process.exit(1)})"
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build production image
        run: docker build --tag gitatlas-site:ci .
      - name: smoke test production image
        run: |
          set -euo pipefail
          container=gitatlas-site-ci
          volume=gitatlas-site-ci-cache
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then docker logs "$container" || true; fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run --detach --name "$container" --publish 127.0.0.1:8130:8130 --mount "source=$volume,target=/data" gitatlas-site:ci >/dev/null

          ready=false
          for attempt in {1..30}; do
            if [ "$(curl --fail --silent http://127.0.0.1:8130/healthz || true)" = "ok" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ]
          docker exec "$container" git --version
          docker exec "$container" sh -c 'test "$(id -u)" -ne 0'
          docker exec "$container" sh -c 'touch /data/.ci-write-probe && rm /data/.ci-write-probe'
